# Compiles the D3D12 (DXBC, shader model 5.1) bytecode of the scene effects
# shaders with FXC, which only exists on Windows. The headers come out as the
# "scene-fx-dxbc" artifact (and base64 in the log) to be committed by hand;
# the SPIR-V headers are built with glslangValidator on any OS.
name: Scene effects DXBC

on:
  push:
    branches: ["claude/**", "banjo-**"]
    paths:
      - "src/graphics/shaders/scene_fx/**"
      - "scripts/build_scene_fx_shaders.py"
      - ".github/workflows/scene-fx-dxbc.yaml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  dxbc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Compile with FXC
        shell: pwsh
        run: |
          $fxc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\fxc.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $fxc) { throw "fxc.exe not found" }
          Write-Host "Using $($fxc.FullName)"
          python scripts/build_scene_fx_shaders.py --dxbc-only --fxc $fxc.FullName
          if ($LASTEXITCODE -ne 0) { throw "shader build failed" }
          # Only the headers that differ from the commit's.
          $out = "dxbc"
          New-Item -ItemType Directory -Force $out | Out-Null
          $changed = git diff --name-only -- src/graphics/shaders/bytecode/d3d12_5_1
          foreach ($path in $changed) {
            Copy-Item $path $out
            $name = [IO.Path]::GetFileNameWithoutExtension($path)
            $b64 = [Convert]::ToBase64String([IO.File]::ReadAllBytes($path))
            Write-Host "DXBC-HEADER $name $b64"
          }
          Write-Host "changed: $($changed.Count)"

      - uses: actions/upload-artifact@v4
        with:
          name: scene-fx-dxbc
          path: dxbc/*.h
          if-no-files-found: ignore
